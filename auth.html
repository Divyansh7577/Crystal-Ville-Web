<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Ville — Login</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head><body><nav class="nav"><a class="brand" href="index.html"><span class="crystal">✦</span> CRYSTAL <b>VILLE</b></a><div class="navlinks"><a href="index.html">Home</a></div></nav><main class="adminwrap"><section class="auth glass"><div class="mini">PLAYER ACCOUNT</div><h1 style="font:700 34px Unbounded">Enter the <span style="color:var(--am)">Hub.</span></h1><p style="color:var(--muted)">Login or create your Crystal Ville account. Your browser keeps the session saved on this device.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><div class="actions"><button class="btn primary" id="login">Sign in</button><button class="btn ghost" id="signup">Create account</button></div><div id="msg" style="margin-top:14px;color:var(--muted)"></div></section></main><script>const sb=supabase.createClient(CV_SUPABASE_URL,CV_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'crystal-ville-auth'}}),$=id=>document.getElementById(id);async function boot(){const s=await sb.auth.getSession();if(s.data.session)location.href='index.html#playerhub'}$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('pass').value;$('msg').textContent='Signing in…';const r=await sb.auth.signInWithPassword({email,password});if(r.error)$('msg').textContent=r.error.message;else location.href='index.html#playerhub'};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('pass').value;if(password.length<6){$('msg').textContent='Password must be at least 6 characters.';return}$('msg').textContent='Creating account…';const r=await sb.auth.signUp({email,password});if(r.error)$('msg').textContent=r.error.message;else if(r.data.session)location.href='index.html#playerhub';else $('msg').textContent='Account created. Check your email if confirmation is enabled, then sign in.'};boot();</script></body></html>
