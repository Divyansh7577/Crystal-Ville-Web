<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Ville — Player Login</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><nav class="nav"><a class="brand" href="index.html"><span class="crystal">✦</span> CRYSTAL <b>VILLE</b></a><div class="navlinks"><a href="index.html">Home</a><a href="dashboard.html">Player Hub</a></div></nav><main class="adminwrap"><section class="auth glass"><div class="mini">PLAYER ACCOUNT</div><h1 style="font:700 34px Unbounded">Enter the <span style="color:var(--am)">Hub.</span></h1><p style="color:var(--muted)">Create an account or sign in. Your Minecraft username is linked separately with a verification code.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><div class="actions"><button class="btn primary" id="login">Sign in</button><button class="btn ghost" id="signup">Create account</button></div><div id="msg" style="margin-top:14px;color:var(--muted)"></div></section></main><script>const sb=supabase.createClient(CV_SUPABASE_URL,CV_SUPABASE_KEY),$=id=>document.getElementById(id);async function go(){const s=await sb.auth.getSession();if(s.data.session)location.href='dashboard.html'}$('login').onclick=async()=>{msg.textContent='Signing in…';const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)msg.textContent=r.error.message;else location.href='dashboard.html'};$('signup').onclick=async()=>{msg.textContent='Creating account…';const r=await sb.auth.signUp({email:email.value.trim(),password:pass.value});if(r.error)msg.textContent=r.error.message;else if(r.data.session)location.href='dashboard.html';else msg.textContent='Account created. Check your email if email confirmation is enabled, then sign in.'};go();</script></body></html>
