<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Ville — Login</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><nav class="nav"><a class="brand" href="index.html"><span class="crystal">✦</span> CRYSTAL <b>VILLE</b></a><div class="navlinks"><a href="index.html">Home</a></div></nav><main class="adminwrap"><section class="auth glass"><div class="mini">PLAYER ACCOUNT</div><h1 style="font:700 34px Unbounded">Enter the <span style="color:var(--am)">Hub.</span></h1><p style="color:var(--muted)">Login or create your Crystal Ville account. Your browser keeps the session saved on this device.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><div class="actions"><button class="btn primary" id="login">Sign in</button><button class="btn ghost" id="signup">Create account</button></div><div style="display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:12px"><span style="height:1px;flex:1;background:rgba(255,255,255,.12)"></span><span>OR</span><span style="height:1px;flex:1;background:rgba(255,255,255,.12)"></span></div><button class="btn ghost" id="discord" style="width:100%;border-color:rgba(88,101,242,.55)">CONTINUE WITH DISCORD</button><div id="msg" style="margin-top:14px;color:var(--muted)"></div></section></main><script>
const sb=supabase.createClient(CV_SUPABASE_URL,CV_SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    flowType:'pkce',
    storageKey:'crystal-ville-auth'
  }
}),$=id=>document.getElementById(id);

const PROD_ORIGIN='https://playcrystalville.dpdns.org';
const AUTH_REDIRECT=PROD_ORIGIN+'/auth.html';

function playerHub(){
  window.location.replace(PROD_ORIGIN+'/index.html#playerhub');
}

function showError(){
  const p=new URLSearchParams(window.location.search);
  const err=p.get('error_description')||p.get('error');
  if(err){
    $('msg').textContent=decodeURIComponent(err.replace(/\+/g,' '));
    window.history.replaceState({},document.title,window.location.pathname);
  }
}

async function boot(){
  showError();
  const s=await sb.auth.getSession();
  if(s.data.session) playerHub();
}

$('login').onclick=async()=>{
  const email=$('email').value.trim(),password=$('pass').value;
  $('msg').textContent='Signing in…';
  const r=await sb.auth.signInWithPassword({email,password});
  if(r.error)$('msg').textContent=r.error.message;
  else playerHub();
};

$('signup').onclick=async()=>{
  const email=$('email').value.trim(),password=$('pass').value;
  if(password.length<6){
    $('msg').textContent='Password must be at least 6 characters.';
    return;
  }
  $('msg').textContent='Creating account…';
  const r=await sb.auth.signUp({email,password});
  if(r.error)$('msg').textContent=r.error.message;
  else if(r.data.session)playerHub();
  else $('msg').textContent='Account created. Check your email if confirmation is enabled, then sign in.';
};

$('discord').onclick=async()=>{
  const b=$('discord');
  b.disabled=true;
  b.textContent='CONNECTING TO DISCORD…';
  $('msg').textContent='';

  const r=await sb.auth.signInWithOAuth({
    provider:'discord',
    options:{
      redirectTo:AUTH_REDIRECT,
      scopes:'identify email'
    }
  });

  if(r.error){
    $('msg').textContent=r.error.message;
    b.disabled=false;
    b.textContent='CONTINUE WITH DISCORD';
  }
};

sb.auth.onAuthStateChange((event,session)=>{
  if(session && (event==='SIGNED_IN'||event==='INITIAL_SESSION')){
    if(window.location.pathname.toLowerCase().endsWith('auth.html')) playerHub();
  }
});

boot();
</script></body></html>
