<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Ville — Link Tree</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><nav class="nav"><a class="brand" href="index.html"><span class="crystal">✦</span> CRYSTAL <b>VILLE</b></a><div class="navlinks"><a href="index.html">Home</a><a href="dashboard.html">Player Hub</a></div></nav>
<main class="dashboard"><div class="hero" style="padding:35px 0"><div class="eyebrow">CRYSTAL VILLE LINK TREE</div><h1 style="font-size:45px">Everything in <span style="color:var(--am)">one place.</span></h1><p class="lead">Official Crystal Ville destinations, community pages and player tools.</p></div><div id="grid" class="grid"></div></main>
<script>let sb=supabase.createClient(CV_SUPABASE_URL,CV_SUPABASE_KEY);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));async function load(){let r=await sb.from("website_links").select("title,url,icon,description").eq("enabled",true).order("sort_order");let x=r.data||[];x=[{title:"Player Hub",url:"dashboard.html",icon:"◈",description:"Check your profile, Crystals and achievements."},...x.filter(a=>a.title.toLowerCase()!=="store")];document.querySelector("#grid").innerHTML=x.map(a=>`<a class="tile" href="${esc(a.url)}"><span class="tileicon">${esc(a.icon||"✦")}</span><div><b>${esc(a.title)}</b><p>${esc(a.description||"Open page")}</p></div><span class="arrow">↗</span></a>`).join("")}load()</script></body></html>
